[project]
name = "relook"
version = "0.1.0"
description = "AI document triage with human-in-the-loop review: classify, summarize, and extract requests from PDFs and DOCX files."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.68.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
relook = "relook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
